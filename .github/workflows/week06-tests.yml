name: Week 6 speech examples (offline)

on:
  push:
    branches: [2026]
  pull_request:
    branches: [2026]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check speech examples without packages, models or microphone
        run: python -S week06/speech/test_speech.py
      - name: Check local chat client without a server or model
        run: python -S week06/speech/test_local_reply.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser sketches without audio or microphone
        run: node week06/browser/test_sketches.cjs
